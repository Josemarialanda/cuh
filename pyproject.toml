[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuh"
version = "0.1.0"
description = "An esoteric programming language where every statement must end with cuh"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
cuh = "cuh.__main__:main"

[tool.setuptools]
packages = ["cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
